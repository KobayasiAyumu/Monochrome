<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>モノクロ画像変換ツール</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333;
            text-align: center;
        }
        h1 { margin-bottom: 20px; }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: 0 auto;
        }
        
        /* ファイル入力エリア（修正版） */
        .upload-area {
            display: block; /* labelタグなのでブロック要素にする */
            border: 3px dashed #ccc;
            padding: 30px;
            border-radius: 8px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: border-color 0.3s;
            background-color: #fafafa;
        }
        .upload-area:hover { border-color: #666; background-color: #f0f0f0; }
        
        /* inputタグは隠す */
        input[type="file"] { display: none; }
        
        .upload-label-text {
            font-size: 1.2rem;
            color: #666;
            display: block; 
            pointer-events: none; /* 文字をクリックしても親のlabelが反応するように */
        }

        /* 画像プレビュー領域 */
        .preview-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-bottom: 20px;
            display: none;
        }
        .preview-box { flex: 1; min-width: 250px; }
        .preview-box h3 { margin-bottom: 10px; font-size: 1rem; color: #555; }
        img.preview-image {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            border: 2px solid #eee;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* 操作ボタン */
        .controls { margin-top: 20px; display: none; }
        button {
            padding: 12px 24px;
            margin: 0 10px 10px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }
        
        .btn-convert { background-color: #333; }
        .btn-dl-jpeg { background-color: #e67e22; }
        .btn-dl-png { background-color: #2980b9; }
        
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* 処理用のCanvasは隠す */
        #processCanvas { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>📷 モノクロ画像変換ツール</h1>

        <label class="upload-area">
            <input type="file" id="imageInput" accept="image/png, image/jpeg">
            <span class="upload-label-text">
                📁 ここをクリックして画像を選択<br>
                <span style="font-size:0.9rem">(JPEG または PNG)</span>
            </span>
        </label>

        <div class="preview-container" id="previewContainer">
            <div class="preview-box">
                <h3>元の画像</h3>
                <img id="originalPreview" class="preview-image" alt="元の画像">
            </div>
            <div class="preview-box" id="convertedPreviewBox" style="display:none;">
                <h3>モノクロ変換後</h3>
                <img id="convertedPreview" class="preview-image" alt="変換後">
            </div>
        </div>

        <div class="controls" id="controls">
            <button class="btn-convert" onclick="convertToMonochrome()">🔄 モノクロに変換</button>
            <div style="margin-top: 15px;">
                <button class="btn-dl-jpeg" onclick="downloadImage('jpeg')" id="dlJpegBtn" disabled>⬇️ JPEGで保存</button>
                <button class="btn-dl-png" onclick="downloadImage('png')" id="dlPngBtn" disabled>⬇️ PNGで保存</button>
            </div>
        </div>
    </div>

    <canvas id="processCanvas"></canvas>

    <script>
        const imageInput = document.getElementById('imageInput');
        const previewContainer = document.getElementById('previewContainer');
        const originalPreview = document.getElementById('originalPreview');
        const convertedPreviewBox = document.getElementById('convertedPreviewBox');
        const convertedPreview = document.getElementById('convertedPreview');
        const controls = document.getElementById('controls');
        const canvas = document.getElementById('processCanvas');
        const ctx = canvas.getContext('2d');
        
        let originalImageObject = null;

        // 画像選択時の処理
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();

            reader.onload = function(event) {
                originalImageObject = new Image();
                originalImageObject.onload = function() {
                    // 表示のリセットと更新
                    originalPreview.src = originalImageObject.src;
                    previewContainer.style.display = 'flex';
                    controls.style.display = 'block';
                    convertedPreviewBox.style.display = 'none';
                    convertedPreview.src = "";
                    document.getElementById('dlJpegBtn').disabled = true;
                    document.getElementById('dlPngBtn').disabled = true;
                };
                originalImageObject.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // モノクロ変換処理
        function convertToMonochrome() {
            if (!originalImageObject) return;

            // キャンバスサイズ設定
            canvas.width = originalImageObject.width;
            canvas.height = originalImageObject.height;

            // 画像を描画
            ctx.drawImage(originalImageObject, 0, 0);

            // ピクセルデータを取得
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            // 全ピクセルを操作
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                
                // グレースケール変換 (NTSC係数)
                const gray = 0.299 * r + 0.587 * g + 0.114 * b;

                data[i] = gray;     // R
                data[i + 1] = gray; // G
                data[i + 2] = gray; // B
            }

            // 画像データを書き戻す
            ctx.putImageData(imageData, 0, 0);

            // プレビュー表示
            convertedPreview.src = canvas.toDataURL('image/png');
            convertedPreviewBox.style.display = 'block';
            
            // 保存ボタン有効化
            document.getElementById('dlJpegBtn').disabled = false;
            document.getElementById('dlPngBtn').disabled = false;
        }

        // ダウンロード処理
        function downloadImage(format) {
            if (!convertedPreview.src) return;
            const link = document.createElement('a');
            
            if (format === 'jpeg') {
                link.href = canvas.toDataURL('image/jpeg', 0.9);
                link.download = 'monochrome_image.jpg';
            } else {
                link.href = canvas.toDataURL('image/png');
                link.download = 'monochrome_image.png';
            }
            link.click();
        }
    </script>
</body>
</html>
